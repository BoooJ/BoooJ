<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-labelledby="t d">
<title id="t">Paul Morel — AI engineer, cybersecurity background</title>
<desc id="d">Header banner: ISEP 2026, open to opportunities. Paul Morel, AI engineer with a cybersecurity background. From a real need to a release: spec, AI agents, review.</desc>
<style>
  .drift { animation: drift 16s ease-in-out infinite alternate; }
  .caret { animation: blink 1.1s step-end infinite; }
  @keyframes drift {
    0%   { transform: translate(0px, 0px); }
    50%  { transform: translate(-90px, 30px); }
    100% { transform: translate(-170px, -6px); }
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .drift, .caret { animation: none; } }
</style>
<defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="8" r="1.4" fill="#30363d"/>
  </pattern>
  <pattern id="dotsLit" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="8" r="2.2" fill="#62c4a6"/>
  </pattern>
  <linearGradient id="fadeGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0.62" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <radialGradient id="glowGrad">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="washGrad">
    <stop offset="0" stop-color="#62c4a6" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#62c4a6" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="228" rx="14"/></clipPath>
  <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="230">
    <rect width="960" height="230" fill="url(#fadeGrad)"/>
  </mask>
  <mask id="glow" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="230">
    <circle class="drift" cx="850" cy="100" r="130" fill="url(#glowGrad)"/>
  </mask>
</defs>
<rect x="0.5" y="0.5" width="959" height="229" rx="14" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#frame)">
  <circle class="drift" cx="850" cy="100" r="180" fill="url(#washGrad)"/>
  <g mask="url(#fade)">
    <rect width="960" height="230" fill="url(#dots)"/>
    <rect width="960" height="230" fill="url(#dotsLit)" mask="url(#glow)"/>
  </g>
</g>
<path d="M11 16h10M16 11v10" stroke="#484f58" stroke-width="1"/><path d="M939 16h10M944 11v10" stroke="#484f58" stroke-width="1"/><path d="M11 214h10M16 209v10" stroke="#484f58" stroke-width="1"/><path d="M939 214h10M944 209v10" stroke="#484f58" stroke-width="1"/>
<text x="52" y="60" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#9198a1" letter-spacing="1.2">[ ISEP 2026 · open to opportunities ]</text>
<text x="48" y="124" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1.2">Paul Morel</text>
<text x="52" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="600" fill="#62c4a6">AI engineer — cybersecurity background</text>
<text x="52" y="203" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#9198a1">need → spec → AI agents → review → release<tspan class="caret" fill="#62c4a6"> _</tspan></text>
</svg>
