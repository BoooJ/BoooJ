<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" width="600" height="610" role="img" aria-labelledby="t d"><title id="t">The release loop</title><desc id="d">A six-step loop for every change: 01 I describe the change (goal, constraints, language); 02 an agent writes the code; 03 a restore point copies the live theme; 04 I review, then accept or send it back; 05 publishing, one file at a time; 06 I test the live shop (pages, cart, Lighthouse). If anything is off, the loop starts again at 01. Every batch is logged: state before, state after and the rollback command.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x="0.5" y="0.5" width="599" height="609" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M9 14h10M14 9v10" stroke="#afb8c1" stroke-width="1"/><path d="M581 14h10M586 9v10" stroke="#afb8c1" stroke-width="1"/><path d="M9 596h10M14 591v10" stroke="#afb8c1" stroke-width="1"/><path d="M581 596h10M586 591v10" stroke="#afb8c1" stroke-width="1"/><text x="28.0" y="38.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" letter-spacing="1.2">FIG. 2 · THE RELEASE LOOP</text><circle cx="300" cy="325" r="200" fill="none" stroke="#8c959f" stroke-width="1.5"/><path d="M-6 -5 L5 0 L-6 5z" fill="#8c959f" transform="translate(400.0 151.8) rotate(30)"/><path d="M-6 -5 L5 0 L-6 5z" fill="#8c959f" transform="translate(500.0 325.0) rotate(90)"/><path d="M-6 -5 L5 0 L-6 5z" fill="#8c959f" transform="translate(400.0 498.2) rotate(150)"/><path d="M-6 -5 L5 0 L-6 5z" fill="#8c959f" transform="translate(200.0 498.2) rotate(210)"/><path d="M-6 -5 L5 0 L-6 5z" fill="#8c959f" transform="translate(100.0 325.0) rotate(270)"/><path d="M-6 -5 L5 0 L-6 5z" fill="#8c959f" transform="translate(200.0 151.8) rotate(330)"/><rect x="207.0" y="87.0" width="186.0" height="76.0" rx="12" fill="#1d6b58" stroke="#1d6b58" stroke-width="1"/><text x="300.0" y="107.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2ece4" text-anchor="middle" letter-spacing="1">01</text><text x="300.0" y="129.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Describe the change</text><text x="300.0" y="148.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#d2ece4" text-anchor="middle">goal, constraints, language</text><rect x="380.2" y="187.0" width="186.0" height="76.0" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="473.2" y="207.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#1d6b58" text-anchor="middle" letter-spacing="1">02</text><text x="473.2" y="229.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Agent writes code</text><text x="473.2" y="248.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Claude Code or Codex</text><rect x="380.2" y="387.0" width="186.0" height="76.0" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="473.2" y="407.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#1d6b58" text-anchor="middle" letter-spacing="1">03</text><text x="473.2" y="429.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Restore point</text><text x="473.2" y="448.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">copy of the live theme</text><rect x="207.0" y="487.0" width="186.0" height="76.0" rx="12" fill="#1d6b58" stroke="#1d6b58" stroke-width="1"/><text x="300.0" y="507.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2ece4" text-anchor="middle" letter-spacing="1">04</text><text x="300.0" y="529.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">I review</text><text x="300.0" y="548.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#d2ece4" text-anchor="middle">accept, or send back</text><rect x="33.8" y="387.0" width="186.0" height="76.0" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="126.8" y="407.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#1d6b58" text-anchor="middle" letter-spacing="1">05</text><text x="126.8" y="429.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Publish</text><text x="126.8" y="448.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">one file at a time</text><rect x="33.8" y="187.0" width="186.0" height="76.0" rx="12" fill="#1d6b58" stroke="#1d6b58" stroke-width="1"/><text x="126.8" y="207.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2ece4" text-anchor="middle" letter-spacing="1">06</text><text x="126.8" y="229.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Live test</text><text x="126.8" y="248.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#d2ece4" text-anchor="middle">pages, cart, Lighthouse</text><text x="300.0" y="307.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Every batch is logged</text><text x="300.0" y="331.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">state before · state after</text><text x="300.0" y="349.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">rollback command</text><text x="300.0" y="377.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#1d6b58" text-anchor="middle">anything off → back to 01</text></svg>
