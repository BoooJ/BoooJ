<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d"><title id="t">How the agents are organised</title><desc id="d">I set products, markets, pricing, specs and trade-offs. Coding agents (Claude Code, Codex) write the theme code from a written brief and rules; image and video models generate the ad visuals under my art direction. I review and approve the code, or send it back; I select and edit the visuals, or send them back. Approved code goes to the live shop, approved visuals to the ads. Credentials, bank details and identity are never delegated.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs><rect x="0.5" y="0.5" width="599" height="559" rx="16" fill="#0d1117" stroke="#30363d"/><path d="M9 14h10M14 9v10" stroke="#484f58" stroke-width="1"/><path d="M581 14h10M586 9v10" stroke="#484f58" stroke-width="1"/><path d="M9 546h10M14 541v10" stroke="#484f58" stroke-width="1"/><path d="M581 546h10M586 541v10" stroke="#484f58" stroke-width="1"/><text x="28.0" y="38.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start" letter-spacing="1.2">FIG. 1 · WHO DOES WHAT</text><rect x="170.0" y="58.0" width="260.0" height="82.0" rx="12" fill="#1f6f5a" stroke="#1f6f5a" stroke-width="1"/><text x="300.0" y="88.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Me</text><text x="300.0" y="109.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c6e9dd" text-anchor="middle">products · markets · pricing</text><text x="300.0" y="127.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c6e9dd" text-anchor="middle">specs, trade-offs, final say</text><path d="M240 140 V160 H160 V186" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M360 140 V160 H440 V186" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="168.0" y="178.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">brief + rules</text><text x="432.0" y="178.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">art direction</text><rect x="40.0" y="190.0" width="240.0" height="86.0" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="160.0" y="220.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Coding agents</text><text x="160.0" y="239.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">Claude Code · Codex</text><text x="160.0" y="256.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">write the theme code</text><rect x="320.0" y="190.0" width="240.0" height="86.0" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="440.0" y="228.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Image &amp; video models</text><text x="440.0" y="247.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">generate the ad visuals</text><path d="M160 276 V312" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M440 276 V312" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60.0" y="316.0" width="200.0" height="54.0" rx="27" fill="#1f6f5a" stroke="#1f6f5a" stroke-width="1"/><text x="160.0" y="348.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">I review &amp; approve</text><rect x="340.0" y="316.0" width="200.0" height="54.0" rx="27" fill="#1f6f5a" stroke="#1f6f5a" stroke-width="1"/><text x="440.0" y="348.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">I select &amp; edit</text><path d="M60 343 H30 V233 H38" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="4 4"/><path d="M540 343 H570 V233 H562" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="4 4"/><text x="24.0" y="290.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle" transform="rotate(-90 24 290)">send back</text><text x="578.0" y="290.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle" transform="rotate(90 578 290)">send back</text><path d="M160 370 V406" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M440 370 V406" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="168.0" y="393.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">approved</text><text x="448.0" y="393.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">approved</text><rect x="60.0" y="410.0" width="200.0" height="56.0" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="160.0" y="433.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Live shop</text><text x="160.0" y="452.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">Shopify</text><rect x="340.0" y="410.0" width="200.0" height="56.0" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="440.0" y="433.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Ads</text><text x="440.0" y="452.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">videos and visuals</text><rect x="28.0" y="490.0" width="544.0" height="44.0" rx="10" fill="none" stroke="#62c4a6" stroke-width="1" stroke-dasharray="5 5"/><rect x="196" y="510" width="13" height="10" rx="2" fill="none" stroke="#62c4a6" stroke-width="1.6"/><path d="M199 510v-3a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="#62c4a6" stroke-width="1.6"/><text x="218" y="517" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#e6edf3"><tspan font-weight="600" fill="#62c4a6">Never delegated:</tspan> credentials, bank details, identity</text></svg>
