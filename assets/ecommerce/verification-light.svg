<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d"><title id="t">How changes are verified</title><desc id="d">My tests on the live shop and pre-launch audits (Lighthouse, every URL, every resource, third-party scripts) surface defects. An agent codes the fix; I validate it on the live shop, and if it is not fixed it goes back to the agent. Once fixed, a rule is written into the project notes when the defect could come back. Caught this way: image file names translated, breaking images; a language choice overridden by automatic detection; a cart that reloaded after a server error; personal data on a legal page.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x="0.5" y="0.5" width="599" height="559" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M9 14h10M14 9v10" stroke="#afb8c1" stroke-width="1"/><path d="M581 14h10M586 9v10" stroke="#afb8c1" stroke-width="1"/><path d="M9 546h10M14 541v10" stroke="#afb8c1" stroke-width="1"/><path d="M581 546h10M586 541v10" stroke="#afb8c1" stroke-width="1"/><text x="28.0" y="38.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" letter-spacing="1.2">FIG. 3 · HOW CHANGES ARE VERIFIED</text><rect x="24.0" y="58.0" width="168.0" height="70.0" rx="12" fill="#1d6b58" stroke="#1d6b58" stroke-width="1"/><text x="108.0" y="90.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">My tests</text><text x="108.0" y="109.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#d2ece4" text-anchor="middle">on the live shop</text><rect x="206.0" y="58.0" width="168.0" height="70.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="290.0" y="80.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Pre-launch audits</text><text x="290.0" y="99.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle">Lighthouse · every URL</text><text x="290.0" y="116.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle">resources · 3rd-party scripts</text><path d="M108 128 V150 H186 V168" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M290 128 V150 H214 V168" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="124.0" y="172.0" width="152.0" height="44.0" rx="22" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/><text x="200.0" y="199.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#9a6700" text-anchor="middle">Defect found</text><path d="M200 216 V244" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="84.0" y="248.0" width="232.0" height="56.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="200.0" y="280.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Agent codes the fix</text><path d="M200 304 V332" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="74.0" y="336.0" width="252.0" height="56.0" rx="28" fill="#1d6b58" stroke="#1d6b58" stroke-width="1"/><text x="200.0" y="369.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">I validate it on the live shop</text><path d="M74 364 H48 V276 H80" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="4 4"/><text x="38.0" y="320.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle" transform="rotate(-90 38 320)">not fixed</text><path d="M200 392 V424" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="208.0" y="413.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">fixed</text><rect x="64.0" y="428.0" width="272.0" height="74.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="200.0" y="452.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Written rule</text><text x="200.0" y="471.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle">in the project notes, when</text><text x="200.0" y="488.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle">the defect could come back</text><text x="404.0" y="76.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" letter-spacing="1.2">CAUGHT THIS WAY</text><rect x="398.0" y="90.0" width="178.0" height="54.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="413" cy="110" r="4" fill="#9a6700"/><text x="424.0" y="114.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Image file names</text><text x="424.0" y="132.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">translated, images broken</text><rect x="398.0" y="156.0" width="178.0" height="54.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="413" cy="176" r="4" fill="#9a6700"/><text x="424.0" y="180.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Language choice</text><text x="424.0" y="198.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">overridden by detection</text><rect x="398.0" y="222.0" width="178.0" height="54.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="413" cy="242" r="4" fill="#9a6700"/><text x="424.0" y="246.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Cart page reload</text><text x="424.0" y="264.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">after a server error</text><rect x="398.0" y="288.0" width="178.0" height="54.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="413" cy="308" r="4" fill="#9a6700"/><text x="424.0" y="312.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Personal data</text><text x="424.0" y="330.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">on a legal page</text><text x="398.0" y="372.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Each one fixed by the agent,</text><text x="398.0" y="390.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">validated by me on the live shop.</text></svg>
